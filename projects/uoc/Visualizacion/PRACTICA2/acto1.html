<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acto 1: El Mito de la Población</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <div class="header-content">
                <div class="act-badge">ACTO 1</div>
                <h1>El Mito de la Población</h1>
                <p class="subtitle">¿Se necesita ser un país gigante para tener cultura deportiva?</p>
            </div>
        </header>

        <div class="controls-wrapper">
            <div class="controls">
                <label for="year-slider">Año Olímpico</label>
                <div class="slider-container">
                    <input type="range" id="year-slider" min="1896" max="2024" step="4" value="2024">
                    <span id="year-display" class="year-display">2024</span>
                </div>
            </div>
        </div>

        <div id="chart-container" class="chart-container"></div>

        <div id="details-panel" class="details-panel">
            <button id="close-panel" class="close-btn">×</button>
            
            <div class="panel-header">
                <h2 id="panel-country">País</h2>
                <h4 id="panel-year">Año</h4>
            </div>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-label">Población Total</span>
                    <span class="stat-value" id="panel-pop">0</span>
                </div>

                <div class="stat-box clickable" id="medals-box" title="Click para ver especialización del país">
                    <span class="stat-label">Total Medallas</span>
                    <span class="stat-value gold" id="panel-medals">0</span>
                    <span class="stat-hint">→ Ver Feudos Deportivos</span>
                </div>

                <div class="stat-box full-width">
                    <span class="stat-label">Índice de Eficiencia</span>
                    <span class="stat-value" id="panel-efficiency">0.00</span>
                    <p class="stat-desc">Medallas por cada 10 Millones de hab.</p>
                </div>
            </div>

            <div class="divider"></div>

            <div class="panel-fact">
                <p id="panel-fact">Selecciona un país en el gráfico...</p>
            </div>
        </div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
